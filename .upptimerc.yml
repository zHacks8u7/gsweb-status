# Estado de los servicios de GS Web — monitoreo externo con Upptime (https://upptime.js.org).
#
# Este repositorio es PÚBLICO a propósito (GitHub Actions y Pages gratuitos). Solo contiene:
#   - direcciones públicas de gsweb.com.uy (las mismas que cualquier visitante puede abrir),
#   - el historial de disponibilidad que genera Upptime desde que empezó el monitoreo,
#   - el script que reporta cada corrida a GS Web (firmado; el secreto vive en los secretos del repositorio).
# Nunca agregar código privado, credenciales, datos de clientes, rutas internas ni detalles de errores.

owner: zHacks8u7
repo: gsweb-status
user-agent: zHacks8u7

sites:
  # Página pública principal. Se considera caída si no responde 200 o si no contiene la marca;
  # «degradada» si tarda más de 5 s (los ejecutores de GitHub tienen latencia variable).
  - name: Sitio web
    slug: sitio-web
    url: https://www.gsweb.com.uy/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "GS Web"

  # ---------------------------------------------------------------------------------------------------------
  # PENDIENTE DE DESPLIEGUE: estas rutas existen en el código nuevo de GS Web pero todavía NO en producción
  # (hoy responden 404). Activarlas recién después de desplegar, o Upptime abriría incidentes falsos.
  # ---------------------------------------------------------------------------------------------------------
  # - name: API
  #   slug: api
  #   url: https://www.gsweb.com.uy/api/health/live
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 3000
  #   __dangerous__body_down_if_text_missing: '"status":"ok"'
  # - name: Portal de clientes
  #   slug: portal
  #   url: https://www.gsweb.com.uy/portal
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 5000
  #   __dangerous__body_down_if_text_missing: "Portal"
  # # Dependencias críticas (base de datos y autenticación). 503 = caída; «degraded» en el cuerpo = degradado.
  # - name: Datos y acceso
  #   slug: datos-y-acceso
  #   url: https://www.gsweb.com.uy/api/health/ready
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 5000
  #   __dangerous__body_degraded: '"status":"degraded"'

# Los avisos manuales y mantenimientos que publica GS Web llegan como issues con la etiqueta «gs-web».
# Los incidentes que abre Upptime llevan su propio título (en inglés: no se puede cambiar por configuración).

status-website:
  # Sin dominio propio todavía: GitHub Pages en https://zhacks8u7.github.io/gsweb-status
  # Al configurar el DNS (CNAME status → zhacks8u7.github.io), reemplazar baseUrl por:  cname: status.gsweb.com.uy
  baseUrl: /gsweb-status
  name: Estado de GS Web
  logoUrl: https://raw.githubusercontent.com/zHacks8u7/gsweb-status/master/assets/gsweb-mark.png
  favicon: https://raw.githubusercontent.com/zHacks8u7/gsweb-status/master/assets/gsweb-mark.png
  introTitle: "Estado de los servicios de **GS Web**"
  introMessage: "Disponibilidad y tiempos de respuesta medidos desde GitHub Actions cada 5 minutos como mínimo (a veces con demora). Los datos empiezan el día en que se activó este monitoreo."
  theme: dark
  navbar:
    - title: Estado
      href: /
    - title: Sitio web
      href: https://www.gsweb.com.uy
  metaTags:
    - name: description
      content: Estado de los servicios de GS Web.
  css: |
    :root {
      --body-background-color: #04110b;
      --body-text-color: #eef6f0;
      --card-background-color: #0b1f16;
      --nav-background-color: #04110b;
      --nav-border-bottom-color: #1d3a2c;
      --nav-current-border-bottom-color: #c9f45f;
      --card-border-color: #1d3a2c;
      --up-border-left-color: #34d399;
      --tag-up-background-color: #34d399;
      --degraded-border-left-color: #fbbf24;
      --tag-degraded-background-color: #fbbf24;
      --change-background-color: #fbbf24;
      --tag-color: #04110b;
      --submit-button-background-color: #c9f45f;
      --submit-button-border-color: #a6d23c;
      --submit-button-color: #04110b;
      --error-button-background-color: #c9f45f;
      --error-button-border-color: #a6d23c;
      --error-button-color: #04110b;
    }
    a { color: #c9f45f; }

